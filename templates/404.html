{% extends 'base.html' %} {% block title %}404 - Brawlable{% endblock %} {%
block content %}
<div class="container-fluid px-0">
  <div class="row justify-content-center mx-0">
    <div class="col-12 text-center p-4 bg-light">
      <img
        src="amazing place holder"
        alt="Temporary 404 illustration"
        class="img-fluid rounded mb-4"
      />

      <h1 class="display-5 fw-bold mb-2">
        <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>404
      </h1>

      <p class="lead mb-4">Hmm. This page doesn't seem to exist.</p>

      <a href="/" class="btn btn-primary text-white text-decoration-none px-3">
        Return to home?
      </a>

      <div class="container mt-2">
        <p>
          Or maybe visit our
          <a href="/sitemap" class="text-decoration-none">Site Map!</a>
        </p>
      </div>

      <div class="container mt-2">
        <details style="cursor: pointer">
          <summary class="text-muted">
            <small style="user-select: none">Detailed Reason</small>
          </summary>
          <p class="mt-2 pl-3">
            {{ error_code }} occurring at
            <time id="aest-time"></time>
            <br />
            <a href="{{ site_url }}" class="text-decoration-none"
              >{{ site_url }}</a
            >
          </p>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
  const loadTime = new Date();

  const options = {
    timeZone: "Australia/Sydney",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true,
    year: "numeric",
    month: "long",
    day: "numeric",
  };

  const formatter = new Intl.DateTimeFormat("en-AU", options);
  document.getElementById("aest-time").textContent =
    formatter.format(loadTime) + " AEST";
</script>

{% endblock %}
