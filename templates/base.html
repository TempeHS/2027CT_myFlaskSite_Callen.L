<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Brawlable{% endblock %}</title>

    <!-- Bootstrap CSS from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Boostrap Icons from CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Your custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <!-- Favicon-->
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg" />

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% include 'partials/nav.html' %}

    <main>
      {% block content %}
      <!-- Page content goes here -->
      {% endblock %}
    </main>

    <footer>{% include 'partials/footer.html' %}</footer>

    <!-- Bootstrap JavaScript from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Warning Script for Console -->
    <script>
      // 1. Define the timing helper
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      console.log("Loading console session...");

      async function runWarning() {
        await sleep(2000);

        console.clear();

        console.log(
          "%cSTOP!",
          "color: red; font-size: 55px; font-weight: bold; -webkit-text-stroke: 2px black;",
        );

        console.log(
          "%cUsing this console may allow attackers to impersonate you and steal your information using an attack called Self-XSS.",
          "color: #D3D3D3; font-size: 22px; font-weight: bold;",
        );

        console.log(
          "%cDo not enter or paste code that you do not understand.",
          "color: tomato; font-size: 20px; font-weight: bold; line-height: 2;",
        );
      }

      runWarning();
    </script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
