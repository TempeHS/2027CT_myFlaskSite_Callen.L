<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Brawlable{% endblock %}</title>

  <!-- Bootstrap CSS from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Theme for the Website -->
  <script src="{{ url_for('static', filename='js/site-theme.js') }}"></script>

  <!-- My custom CSS and yep its quite important I believe -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global-styles.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site-fx.css') }}" />

  <!-- Favicon-->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}" />

  <!-- Bootsrap Icons from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  {% block extra_css %}{% endblock %}
</head>

<body>
  {% include 'partials/nav.html' %}

  <main>
    {% block content %}
    <!-- Mhm, page content goes here. -->
    {% endblock %}
  </main>

  <footer>{% include 'partials/footer.html' %}</footer>

  {% block extra_js %}{% endblock %}

  <button id="back-to-top" type="button" aria-label="Scroll to top">
    ↑
  </button>

  <!-- Bootstrap JavaScript from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JavaScript Files -->
  <script src="{{ url_for('static', filename='js/base.js') }}" defer></script>

</body>

</html>
