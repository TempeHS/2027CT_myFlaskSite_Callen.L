<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Brawlable{% endblock %}</title>
  <script src="/static/js/site-theme.js"></script>

  <!-- Bootstrap CSS from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Boostrap Icons from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global-styles.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site-fx.css') }}" />

  <!-- Favicon-->
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg" />

  {% block extra_css %}{% endblock %}
</head>

<body>
  {% include 'partials/nav.html' %}

  <main>
    {% block content %}
    <!-- Page content goes here -->
    {% endblock %}
  </main>

  <footer>{% include 'partials/footer.html' %}</footer>

  <!-- Bootstrap JavaScript from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Navigation Bar Blur Level -->
  <script>
    const navbar = document.querySelector(".navbar");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 28) {
        navbar.classList.add("scrolled");
      } else {
        navbar.classList.remove("scrolled");
      }
    });
  </script>

    </script>

  {% block extra_js %}{% endblock %}

  <button id="back-to-top" type="button" aria-label="Scroll to top">
    ↑
  </button>

  <script>
    const backToTopButton = document.getElementById("back-to-top");
    window.addEventListener("scroll", () => {
      if (window.scrollY > 65) {
        backToTopButton.classList.add("show");
      } else {
        backToTopButton.classList.remove("show");
      }
    });
    backToTopButton.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>

</html>
